<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - LPR System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styleLogin.css">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">

        <div class="card shadow p-4" style="width: 350px; border-radius: 12px;">

            <h4 class="text-center mb-4">University LPR System</h4>

            <!-- Username -->
            <label class="form-label">Username</label>
            <div class="input-group mb-3">
                <span class="input-group-text">👤</span>
                <input type="text" id="user" class="form-control" placeholder="Enter your username">
            </div>

            <!-- Password -->
            <label class="form-label">Password</label>
            <div class="input-group mb-3">
                <span class="input-group-text">🔒</span>
                <input type="password" id="pass" class="form-control" placeholder="Enter your password">
            </div>

            <!-- Login Button -->
            <button class="btn btn-primary w-100" onclick="login()">Login</button>

        </div>
    </div>

    <script>
    function login() {
        let username = document.getElementById("user").value;
        let password = document.getElementById("pass").value;

        let formData = new FormData();
        formData.append("username", username);
        formData.append("password", password);

        fetch("http://localhost:8080/api/login", {
            method: "POST",
            body: formData
        })
        .then(res => res.text())
        .then(data => {

            if (data === "success") {
                window.location.href = "dashboard.html";
                console.log("Login successful!");
            } else {
                alert("Wrong username or password!");
            }
        });
    }
    </script>

</body>
</html>
