<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LPRS Registration</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="register-style.css">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0">LPRS Registration Form</h2>

        <div class="btn-group">

            <button type="button" class="btn btn-outline-primary" onclick="goDashboard()">
                Dashboard
            </button>

            <button type="button" class="btn btn-outline-primary" onclick="goOwner()">
                Vehicle Owner
            </button>

            <button type="button" class="btn btn-primary" onclick="goRegister()">
                Register
            </button>

        </div>

    </div>

    <!-- Form Card -->
    <div class="card shadow p-4">

        <form id="registerForm">

            <!-- Owner Information -->
            <h4 class="mb-3">Owner Information</h4>

            <div class="mb-3">
                <label class="form-label">Owner ID</label>
                <input type="text" id="ownerId" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Type</label>
                <select id="type" class="form-select">
                    <option value="student">Student</option>
                    <option value="staff">Staff</option>
                </select>
            </div>

            <hr>

            <!-- Vehicle Information -->
            <h4 class="mb-3">Vehicle Information</h4>

            <div class="mb-3">
                <label class="form-label">Plate No</label>
                <input type="text" id="plateNum" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Colour</label>
                <input type="text" id="colour" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Model</label>
                <input type="text" id="model" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Save Data
            </button>

        </form>

        <p id="message" class="mt-3 text-center"></p>

    </div>

</div>

<script>

function goDashboard() {
    window.location.href = "/dashboard.html";
}

function goOwner() {
    window.location.href = "/vehicle-owner.html";
}

function goRegister() {
    window.location.href = "/register.html";
}

document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const data = {
        ownerId: document.getElementById("ownerId").value,
        name: document.getElementById("name").value,
        type: document.getElementById("type").value,
        plateNum: document.getElementById("plateNum").value,
        colour: document.getElementById("colour").value,
        model: document.getElementById("model").value
    };

    fetch("/api/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to save data");
        }
        return response.text();
    })
    .then(message => {
        document.getElementById("message").innerText = message;
        document.getElementById("registerForm").reset();
    })
    .catch(error => {
        console.error(error);
        document.getElementById("message").innerText = "Error saving data.";
    });
});

</script>

</body>
</html>
