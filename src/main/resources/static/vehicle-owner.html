<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vehicle Owner</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/vehicle-owner.css">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- NAVBAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="d-flex align-items-center gap-3">
            <h4 class="mb-0 fw-bold text-primary">LPRS</h4>
            <span class="text-muted">Vehicle Owner</span>
        </div>

        <div class="btn-group">

            <button class="btn btn-outline-primary" onclick="goDashboard()">
                Dashboard
            </button>

            <button class="btn btn-primary" onclick="goOwner()">
                Vehicle Owner
            </button>

            <button class="btn btn-outline-primary" onclick="goRegister()">
                Register
            </button>

        </div>

    </div>

    <!-- TITLE -->
    <div class="text-center mb-4">

        <div class="display-6">👥 Vehicle Owner List</div>

    </div>

    <!-- TABLE CARD -->
    <div class="card shadow">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-striped table-hover mb-0">

                    <thead class="table-dark">
                        <tr>
                            <th>PLATE NUMBER</th>
                            <th>OWNER ID</th>
                            <th>NAME</th>
                            <th>TYPE</th>
                        </tr>
                    </thead>

                    <tbody id="ownerTable">
                        <tr>
                            <td colspan="4" class="text-center p-3">Loading...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

        <div class="card-footer text-end">
            Total Owners: <span id="totalOwners">0</span>
        </div>

    </div>

</div>

<script>

window.onload = function () {
    loadOwners();
};

function goDashboard() {
    window.location.href = "dashboard.html";
}

function goOwner() {
    window.location.href = "vehicle-owner.html";
}

function goRegister() {
    window.location.href = "register.html";
}

function loadOwners() {

    fetch("api/vehicle-owner")
    .then(res => {
        if (!res.ok) {
            throw new Error("Failed to fetch data");
        }
        return res.json();
    })
    .then(data => {

        let table = document.getElementById("ownerTable");
        let rows = "";

        if (data.length === 0) {
            rows = `<tr><td colspan="4" class="text-center">No data found</td></tr>`;
        } else {
            data.forEach(owner => {

                let badgeClass = owner.type === "staff"
                    ? "bg-danger"
                    : "bg-success";

                rows += `
                <tr>
                    <td>${owner.plateNum}</td>
                    <td>${owner.ownerId}</td>
                    <td>${owner.name}</td>
                    <td>
                        <span class="badge ${badgeClass}">
                            ${owner.type}
                        </span>
                    </td>
                </tr>`;
            });
        }

        table.innerHTML = rows;
        document.getElementById("totalOwners").innerText = data.length;
    })
    .catch(error => {
        console.error("Error:", error);
        document.getElementById("ownerTable").innerHTML =
            `<tr><td colspan="4" class="text-center text-danger">
                Failed to load data. Make sure the server is running.
            </td></tr>`;
    });
}

</script>

</body>
</html>
